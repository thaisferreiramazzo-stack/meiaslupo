<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEIASLUPO.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio MEIASLUPO.COM.BR está disponível para venda. Entre em contato para mais informações.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f5f1;
      color: #181818;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(155, 112, 86, .07);
      top: -270px;
      right: -150px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(155, 112, 86, .05);
      bottom: -220px;
      left: -120px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(24,24,24,.16);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #846553;
    }

    h1 {
      font-size: clamp(38px, 8vw, 78px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .accent {
      color: #9b7056;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 620px;
      margin: 0 auto 38px;
      color: #69635f;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #181818;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #9b7056;
    }

    .footer {
      margin-top: 55px;
      color: #99918c;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="tag">Domínio disponível</div>

    <h1>MEIAS<span class="accent">LUPO</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      O domínio MEIASLUPO.COM.BR está disponível para aquisição.
      Para informações, propostas ou interesse comercial,
      entre em contato diretamente com o proprietário.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20MEIASLUPO.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      MEIASLUPO.COM.BR
    </div>

  </main>

</body>
</html>
